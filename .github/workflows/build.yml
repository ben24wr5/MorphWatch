name: Build mod jar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Publish the jar (or the error log) to the build-output branch
        if: always()
        shell: bash
        run: |
          mkdir -p out
          for f in build/libs/morphwatch-*.jar; do
            case "$f" in *-sources.jar|*-slim.jar) ;; *) [ -f "$f" ] && cp "$f" out/ ;; esac
          done
          cp build-log.txt out/ || echo "no log" > out/build-log.txt
          {
            echo "result: ${{ steps.build.outcome }}"
            echo "commit: ${GITHUB_SHA}"
            echo "date: $(date -u)"
          } > out/STATUS.txt
          cd out
          git init -q
          git checkout -q -b build-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output

      - name: Upload the jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: morphwatch-jar
          path: out/*.jar

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
